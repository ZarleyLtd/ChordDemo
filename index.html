<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>ChordDemo</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="libraryBtn" class="pill icon-btn" type="button" aria-label="Song Library" title="Song Library">
        <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
          <defs>
            <linearGradient id="jbTubes" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ff4d6d"/><stop offset=".3" stop-color="#ffb020"/>
              <stop offset=".5" stop-color="#ffe066"/><stop offset=".7" stop-color="#ffb020"/>
              <stop offset="1" stop-color="#ff4d6d"/>
            </linearGradient>
            <linearGradient id="jbWood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c0562f"/><stop offset="1" stop-color="#7a2e16"/>
            </linearGradient>
          </defs>
          <path d="M4 22.5V10a8 8 0 0 1 16 0v12.5z" fill="url(#jbWood)"/>
          <path d="M5.7 22.2V10a6.3 6.3 0 0 1 12.6 0v12.2" fill="none" stroke="url(#jbTubes)" stroke-width="1.7"/>
          <path d="M8.6 12.2V10a3.4 3.4 0 0 1 6.8 0v2.2z" fill="#1d2026"/>
          <circle cx="12" cy="10.6" r="1.9" fill="#3a3f4b"/><circle cx="12" cy="10.6" r=".6" fill="#ffb020"/>
          <rect x="8.6" y="13.6" width="6.8" height="5.8" rx="1" fill="#f5c84a"/>
          <path d="M8.6 15.2h6.8M8.6 16.6h6.8M8.6 18h6.8" stroke="#7a2e16" stroke-width=".7"/>
          <rect x="3" y="21.8" width="18" height="1.7" rx=".85" fill="#5a2412"/>
        </svg>
      </button>
      <span id="nowTitle" class="now-title"></span>
      <button id="addBtn" class="pill accent icon-btn" type="button" aria-label="Add New Song" title="Add New Song">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <dialog id="libraryDlg" class="dlg" aria-labelledby="libraryHead">
      <div class="dlg-head">
        <h2 id="libraryHead">Song Library</h2>
        <button id="sortBtn" class="pill" type="button" aria-label="Change sort order">Sort: Title</button>
        <button id="filterBtn" class="pill toggle" type="button" aria-pressed="false">Filter</button>
        <button class="pill dlg-close" type="button" data-close aria-label="Close">✕</button>
      </div>
      <input id="filterInput" class="dlg-input" type="search" placeholder="Type to filter by title or artist" aria-label="Filter songs" autocomplete="off" hidden>
      <ul id="songList" class="song-list"></ul>
    </dialog>

    <dialog id="addDlg" class="dlg dlg-small" aria-labelledby="addHead">
      <form id="addForm" class="add" method="dialog">
        <div class="dlg-head">
          <h2 id="addHead">Add New Song</h2>
          <button class="pill dlg-close" type="button" data-close aria-label="Close">✕</button>
        </div>
        <div class="add-row">
          <input id="addInput" class="dlg-input" type="url" inputmode="url" placeholder="Paste YouTube link" aria-label="YouTube link">
          <button type="submit">Go</button>
        </div>
      </form>
    </dialog>

    <div class="stage">
      <div class="video"><div id="player"></div></div>
      <div id="adNote" class="ad-note" hidden>Ad playing: chords and lyrics start when the song does</div>

      <div id="chordStrip" class="strip" role="button" tabindex="0" aria-label="Chords: tap to pause or play">
        <div id="stripPlay" class="strip-play" hidden aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </div>
      </div>

      <div class="lyrics-row">
        <button id="offDown" class="ly-adj" type="button" aria-label="Lyrics earlier">−</button>
        <div class="lyrics" aria-live="off">
          <div id="lyPrev" class="ly prev"></div>
          <div id="lyNow" class="ly cur"></div>
          <div id="lyNext" class="ly nxt"></div>
        </div>
        <button id="offUp" class="ly-adj" type="button" aria-label="Lyrics later">+</button>
      </div>

      <div class="controls">
        <div class="ctl">
          <span class="label">Capo</span>
          <button id="capoDown" aria-label="Capo down">−</button>
          <span id="capoVal" class="val">none</span>
          <button id="capoUp" aria-label="Capo up">+</button>
          <button id="bestBtn" class="pill">Best</button>
        </div>
        <div class="ctl ctl-end">
          <button id="loopBtn" class="pill toggle icon-btn" type="button" aria-pressed="false"
            aria-label="Loop: tap two beats to repeat between them" title="Loop">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/>
              <path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>
            </svg>
          </button>
          <button id="simpleBtn" class="pill toggle icon-btn" type="button" aria-pressed="true"
            aria-label="Simplify chords" title="Simplify chords">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5h18M3 9.5h12"/><path d="M3 14h7"/>
              <path d="M15 14l3 3 3-3"/><path d="M18 11v6"/><path d="M14 20h8"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="meta" class="meta"></div>
    </div>

    <div id="notAnalysed" class="notice" hidden>
      <p>This song hasn't been analysed yet. You can play it with lyrics now. To get chords and beats, run this on your PC, then reload:</p>
      <p><code id="cmd"></code> <button id="copyBtn" class="pill">Copy</button></p>
    </div>

    <main id="grid" class="grid" aria-label="Chords on the beat"></main>

    <footer class="footer">
      Created by <img src="assets/icons/jpLogo-white-rotated-2000.png" alt="JP" class="footer-logo">
    </footer>
  </div>

  <script src="assets/js/utils/brief-message.js"></script>
  <script src="assets/js/utils/music.js"></script>
  <script src="assets/js/utils/lyrics.js"></script>
  <script src="assets/js/components/chord-diagram.js"></script>
  <script src="assets/js/components/chord-strip.js"></script>
  <script src="assets/js/pages/player.js"></script>
  <script src="main.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
